<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D4BFF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Трекер «Макет»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: одна колонка 440px, сводка сверху, лента карточек-«фреймов», нижняя таб-панель и шторка редактирования */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --fg:#16181D; --muted:#6B7180; --line:#D9DCE4;
  --accent:#3D4BFF; --accent-soft:#E3E5FF; --on-accent:#FFFFFF;
  --ok:#14915A; --warn:#C27A00; --bad:#D6334A;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101217; --surface:#1A1D24; --fg:#ECEEF3; --muted:#9097A6; --line:#2C303A;
  --accent:#8D96FF; --accent-soft:#272B52; --on-accent:#0E1020;
  --ok:#3CC985; --warn:#F0A934; --bad:#FF6B7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1A1D24; --fg:#ECEEF3; --muted:#9097A6; --line:#2C303A;
  --accent:#8D96FF; --accent-soft:#272B52; --on-accent:#0E1020;
  --ok:#3CC985; --warn:#F0A934; --bad:#FF6B7E; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;height:auto}
html{overflow-y:auto}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border:2px solid var(--fg);border-radius:9px;position:relative}
.logo::after{content:"";position:absolute;inset:7px;border:2px solid var(--accent);border-radius:50%}
h1{font:700 19px/1 var(--f-display);margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.today{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
h2{font:500 13px var(--f-display);text-transform:uppercase;letter-spacing:.06em;margin:0;color:var(--muted)}

/* Сводка */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;background:var(--accent);color:var(--on-accent)}
.stat.wide span{color:inherit;opacity:.8}
.stat.wide b{font-size:18px}

/* Фильтры */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Карточка-фрейм */
.list{display:flex;flex-direction:column;gap:14px}
.card{position:relative;background:var(--surface);border-radius:4px;padding:16px;text-align:left;border:1px solid transparent;width:100%;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:var(--accent)}
.card .tag{position:absolute;top:-9px;left:12px;font:500 11px var(--f-mono);background:var(--bg);color:var(--accent);padding:0 6px}
.card:hover .h{opacity:1}
.h{position:absolute;width:7px;height:7px;background:var(--surface);border:1.5px solid var(--accent);opacity:0;transition:opacity .15s}
.h.tl{top:-4px;left:-4px}.h.tr{top:-4px;right:-4px}.h.bl{bottom:-4px;left:-4px}.h.br{bottom:-4px;right:-4px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{font-weight:600;font-size:16px;line-height:1.25;min-width:0}
.client{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.late{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.soon{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.done{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg{height:5px;border-radius:3px;background:var(--line)}
.seg.on{background:var(--accent)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.meta .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1.5px dashed var(--line);border-radius:var(--r)}

/* Деньги / дедлайны */
.panel{background:var(--surface);border-radius:var(--r);padding:4px 16px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .l{min-width:0}
.line .l div:first-child{font-weight:500}
.line .l div:last-child{font-size:12px;color:var(--muted)}
.line .r{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.note{font-size:12px;color:var(--muted)}

/* Таб-бар */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr;align-items:center;gap:4px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--accent)}
.add{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--on-accent);border:0;display:grid;place-items:center;margin:0 6px}
.add svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.2}

/* Шторка */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h3{font:700 18px var(--f-display);margin:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;flex:none}
.step.on .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:12px;height:12px;stroke:var(--on-accent);stroke-width:3;fill:none;opacity:0}
.step.on .box svg{opacity:1}
.step .n{font:500 11px var(--f-mono);color:var(--muted);margin-left:auto}
.actions{display:flex;gap:10px}
.btn{flex:1;border-radius:12px;padding:13px;border:0;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);flex:0 0 auto;padding-inline:16px}
.confirm{background:var(--surface);border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div><h1>Макет</h1><div class="sub">трекер проектов дизайнера</div></div>
    </div>
    <div class="today" id="today"></div>
  </header>
  <main id="view"></main>
</div>

<nav aria-label="Разделы"><div class="in">
  <button class="tab" data-tab="projects" aria-current="page">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 9v11"/></svg>Проекты</button>
  <button class="tab" data-tab="deadlines">
    <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Сроки</button>
  <button class="add" id="addBtn" aria-label="Новый проект"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="money">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5H8.5M8.5 14.5h5"/></svg>Оплаты</button>
</div></nav>

<div id="sheetRoot"></div>

<script>
const STAGES=["Исследование","Вайрфреймы","UI-дизайн","Прототип","Передача в разработку"];
const KEY="maket-projects-v1";
const d=(n)=>{const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
const SAMPLE=[
 {id:1,title:"Приложение доставки цветов",client:"Флора Экспресс",type:"iOS + Android",deadline:d(3),budget:180000,paid:90000,stages:[1,1,1,0,0],notes:"Пример. Показать 2 варианта главной в пятницу."},
 {id:2,title:"Редизайн онбординга",client:"Фитнес-клуб «Пульс»",type:"Mobile",deadline:d(12),budget:65000,paid:0,stages:[1,1,0,0,0],notes:"Пример. Ждём аналитику по отвалам на 2-м экране."},
 {id:3,title:"Дизайн-система для банка",client:"Студия Линия",type:"UI-kit",deadline:d(-2),budget:240000,paid:120000,stages:[1,1,1,1,0],notes:"Пример. Осталось задокументировать компоненты."},
 {id:4,title:"Лендинг мобильной игры",client:"Pixel Owl",type:"Web, адаптив",deadline:d(-20),budget:45000,paid:45000,stages:[1,1,1,1,1],notes:"Пример. Сдан."}
];
let projects=load(), tab="projects", filter="all";
try{const t=localStorage.getItem("maket-tab");if(t)tab=t}catch(e){}

function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return SAMPLE.map(p=>({...p,stages:[...p.stages]}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(projects))}catch(e){}}
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rub=(n)=>new Intl.NumberFormat("ru-RU").format(Math.round(n||0))+" ₽";
const daysLeft=(iso)=>{if(!iso)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+"T00:00")-t)/864e5)};
const fmtDate=(iso)=>iso?new Date(iso+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short"}):"без срока";
const doneCount=(p)=>p.stages.filter(Boolean).length;
const isDone=(p)=>doneCount(p)===STAGES.length;
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m==1)return a;return c}
function status(p){
  if(isDone(p))return{cls:"done",txt:"Сдан"};
  const n=daysLeft(p.deadline);
  if(n===null)return{cls:"",txt:STAGES[doneCount(p)]};
  if(n<0)return{cls:"late",txt:"Просрочен на "+(-n)+" "+plural(n,"день","дня","дней")};
  if(n===0)return{cls:"late",txt:"Сдать сегодня"};
  if(n<=5)return{cls:"soon",txt:n+" "+plural(n,"день","дня","дней")};
  return{cls:"",txt:STAGES[doneCount(p)]};
}

$("#today").textContent=new Date().toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"});

function render(){
  document.querySelectorAll(".tab").forEach(b=>{if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const v=$("#view");
  v.innerHTML=tab==="projects"?viewProjects():tab==="deadlines"?viewDeadlines():viewMoney();
  v.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openSheet(+el.dataset.open));
  v.querySelectorAll("[data-filter]").forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render()});
}

function viewProjects(){
  const active=projects.filter(p=>!isDone(p));
  const late=active.filter(p=>{const n=daysLeft(p.deadline);return n!==null&&n<0}).length;
  const owed=projects.reduce((s,p)=>s+Math.max(0,p.budget-p.paid),0);
  const list=projects.filter(p=>filter==="all"?true:filter==="active"?!isDone(p):filter==="late"?(!isDone(p)&&daysLeft(p.deadline)<0):isDone(p))
    .sort((a,b)=>isDone(a)-isDone(b)||(a.deadline||"9").localeCompare(b.deadline||"9"));
  const chip=(k,t)=>`<button class="chip" data-filter="${k}" aria-pressed="${filter===k}">${t}</button>`;
  return `<div class="app" style="padding:0;min-height:0">
  <section class="summary" aria-label="Сводка">
    <div class="stat"><b>${active.length}</b><span>в работе</span></div>
    <div class="stat"><b style="color:${late?"var(--bad)":"inherit"}">${late}</b><span>просрочено</span></div>
    <div class="stat wide"><span>Ждёт оплаты</span><b>${rub(owed)}</b></div>
  </section>
  <div class="chips">${chip("all","Все")}${chip("active","В работе")}${chip("late","Горят")}${chip("done","Сданы")}</div>
  <section class="list">${list.length?list.map(card).join(""):`<div class="empty">Здесь пока пусто.<br>Нажмите «+», чтобы добавить проект.</div>`}</section>
  </div>`;
}
function card(p){
  const s=status(p);
  return `<button class="card" data-open="${p.id}">
    <span class="tag">${esc(p.type||"Проект")}</span>
    <i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>
    <div class="row"><div style="min-width:0"><div class="title">${esc(p.title)}</div><div class="client">${esc(p.client||"Без клиента")}</div></div><span class="pill ${s.cls}">${s.txt}</span></div>
    <div class="stages" aria-label="Этапы: ${doneCount(p)} из 5">${p.stages.map(x=>`<div class="seg ${x?"on":""}"></div>`).join("")}</div>
    <div class="meta"><span>Этап ${Math.min(doneCount(p)+1,5)}/5 · ${fmtDate(p.deadline)}</span><span class="mono">${rub(p.paid)} / ${rub(p.budget)}</span></div>
  </button>`;
}
function viewDeadlines(){
  const act=projects.filter(p=>!isDone(p)&&p.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  const groups=[["Просрочено",p=>daysLeft(p.deadline)<0],["На этой неделе",p=>{const n=daysLeft(p.deadline);return n>=0&&n<=7}],["Позже",p=>daysLeft(p.deadline)>7]];
  let html="";
  for(const [name,f] of groups){const g=act.filter(f);if(!g.length)continue;
    html+=`<h2>${name}</h2><div class="panel">${g.map(p=>{const s=status(p);return `<div class="line" data-open="${p.id}" style="cursor:pointer"><div class="l"><div>${esc(p.title)}</div><div>${STAGES[doneCount(p)]} · ${esc(p.client)}</div></div><div class="r"><div>${fmtDate(p.deadline)}</div><span class="pill ${s.cls}" style="font-family:var(--f-body)">${s.txt}</span></div></div>`}).join("")}</div>`}
  return `<div class="app" style="padding:0;min-height:0">${html||`<div class="empty">Нет проектов со сроками.</div>`}</div>`;
}
function viewMoney(){
  const total=projects.reduce((s,p)=>s+(+p.budget||0),0), paid=projects.reduce((s,p)=>s+(+p.paid||0),0);
  const pct=total?Math.round(paid/total*100):0;
  const debt=projects.filter(p=>p.budget-p.paid>0).sort((a,b)=>(b.budget-b.paid)-(a.budget-a.paid));
  return `<div class="app" style="padding:0;min-height:0">
  <section class="summary">
    <div class="stat"><b>${rub(paid)}</b><span>получено</span></div>
    <div class="stat"><b>${rub(total-paid)}</b><span>ожидается</span></div>
  </section>
  <div class="panel" style="padding:14px 16px;display:flex;flex-direction:column;gap:8px"><div class="meta"><span>Оплачено от суммы договоров</span><span class="mono">${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
  <h2>Кто должен</h2>
  <div class="panel">${debt.length?debt.map(p=>`<div class="line" data-open="${p.id}" style="cursor:pointer"><div class="l"><div>${esc(p.client||p.title)}</div><div>${esc(p.title)}</div></div><div class="r">${rub(p.budget-p.paid)}</div></div>`).join(""):`<div class="line"><div class="l"><div>Все проекты оплачены</div></div></div>`}</div>
  <p class="note">Обычная схема: 50% предоплата, 50% после передачи макетов в разработку.</p>
  </div>`;
}

function openSheet(id){
  const isNew=id==null;
  const p=isNew?{id:Date.now(),title:"",client:"",type:"Mobile",deadline:d(14),budget:0,paid:0,stages:[0,0,0,0,0],notes:""}:{...projects.find(x=>x.id===id)};
  p.stages=[...p.stages];
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="form" role="dialog" aria-label="Проект">
    <div class="grab"></div>
    <h3>${isNew?"Новый проект":"Проект"}</h3>
    <div class="field"><label for="f-title">Название</label><input id="f-title" required value="${esc(p.title)}" placeholder="Например, приложение для кофейни"></div>
    <div class="two"><div class="field"><label for="f-client">Клиент</label><input id="f-client" value="${esc(p.client)}"></div>
    <div class="field"><label for="f-type">Формат</label><select id="f-type">${["Mobile","iOS + Android","Web, адаптив","UI-kit","Аудит UX"].map(t=>`<option ${t===p.type?"selected":""}>${t}</option>`).join("")}</select></div></div>
    <div class="field"><label for="f-deadline">Дедлайн</label><input type="date" id="f-deadline" value="${p.deadline||""}"></div>
    <div class="two"><div class="field"><label for="f-budget">Бюджет, ₽</label><input id="f-budget" inputmode="numeric" value="${p.budget||""}"></div>
    <div class="field"><label for="f-paid">Оплачено, ₽</label><input id="f-paid" inputmode="numeric" value="${p.paid||""}"></div></div>
    <div class="field"><label>Этапы работы</label><div class="steps" id="steps"></div></div>
    <div class="field"><label for="f-notes">Заметки</label><textarea id="f-notes">${esc(p.notes)}</textarea></div>
    <div id="confirmBox"></div>
    <div class="actions">${isNew?"":`<button type="button" class="btn danger" id="del">Удалить</button>`}<button type="button" class="btn ghost" id="cancel">Отмена</button><button class="btn primary">${isNew?"Добавить":"Сохранить"}</button></div>
  </form></div>`;
  const drawSteps=()=>{$("#steps").innerHTML=STAGES.map((s,i)=>`<button type="button" class="step ${p.stages[i]?"on":""}" data-i="${i}" aria-pressed="${!!p.stages[i]}"><span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg></span>${s}<span class="n">0${i+1}</span></button>`).join("");
    $("#steps").querySelectorAll(".step").forEach(b=>b.onclick=()=>{p.stages[+b.dataset.i]=p.stages[+b.dataset.i]?0:1;drawSteps()})};
  drawSteps();
  const close=()=>root.innerHTML="";
  $("#cancel").onclick=close;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
  if(!isNew)$("#del").onclick=()=>{$("#confirmBox").innerHTML=`<div class="confirm">Удалить «${esc(p.title)}»? Вернуть не получится.<div class="actions"><button type="button" class="btn ghost" id="no">Оставить</button><button type="button" class="btn primary" style="background:var(--bad)" id="yes">Удалить</button></div></div>`;
    $("#no").onclick=()=>$("#confirmBox").innerHTML="";
    $("#yes").onclick=()=>{projects=projects.filter(x=>x.id!==p.id);save();close();render();toast("Проект удалён")}};
  $("#form").onsubmit=e=>{e.preventDefault();
    const num=v=>+String(v).replace(/[^\d]/g,"")||0;
    Object.assign(p,{title:$("#f-title").value.trim(),client:$("#f-client").value.trim(),type:$("#f-type").value,deadline:$("#f-deadline").value,budget:num($("#f-budget").value),paid:num($("#f-paid").value),notes:$("#f-notes").value.trim()});
    if(p.paid>p.budget&&p.budget)p.paid=p.budget;
    if(isNew)projects.unshift(p);else projects=projects.map(x=>x.id===p.id?p:x);
    save();close();render();toast(isNew?"Проект добавлен":"Сохранено")};
  setTimeout(()=>{if(isNew)$("#f-title").focus()},50);
}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;try{localStorage.setItem("maket-tab",tab)}catch(e){}render();scrollTo(0,0)});
$("#addBtn").onclick=()=>openSheet(null);
addEventListener("keydown",e=>{if(e.key==="Escape")$("#sheetRoot").innerHTML=""});
render();
</script>
</body>
</html>
